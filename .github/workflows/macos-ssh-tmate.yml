# ============================================================================
# Yöntem 1: tmate ile SSH Erişimi
# En basit yöntem — ek hesap veya secret gerektirmez
# ============================================================================
# Kullanım: Actions → "macOS SSH (tmate)" → Run workflow
# Bağlantı: Workflow loglarından SSH URL'sini kopyalayıp terminale yapıştırın

name: "macOS SSH (tmate)"

on:
  workflow_dispatch:
    inputs:
      macos-version:
        description: "macOS sürümü"
        required: true
        type: choice
        options:
          - "macos-latest"
          - "macos-15"
          - "macos-14"
          - "macos-13"
        default: "macos-latest"
      timeout:
        description: "Maksimum oturum süresi (dakika)"
        required: true
        type: choice
        options:
          - "30"
          - "60"
          - "120"
          - "180"
          - "360"
        default: "120"
      install-transporter:
        description: "Transporter uygulamasını kur"
        required: true
        type: boolean
        default: true
      detached:
        description: "Detached mod (arka planda çalış)"
        required: true
        type: boolean
        default: false

jobs:
  macos-ssh-tmate:
    name: "macOS SSH Oturumu (tmate)"
    runs-on: ${{ github.event.inputs.macos-version }}
    timeout-minutes: ${{ fromJSON(github.event.inputs.timeout) }}

    steps:
      # ── 1. Repo'yu clone et (ipa/ klasörü dahil) ──
      - name: "📥 Repo'yu checkout et"
        uses: actions/checkout@v4

      # ── 2. Ortam hazırlığı ──
      - name: "🔧 Ortam hazırlığı"
        run: |
          chmod +x scripts/setup-environment.sh
          bash scripts/setup-environment.sh

      # ── 3. Transporter kurulumu (opsiyonel) ──
      - name: "📱 Transporter kurulumu"
        if: ${{ github.event.inputs.install-transporter == 'true' }}
        run: |
          chmod +x scripts/install-transporter.sh
          bash scripts/install-transporter.sh

      # ── 4. IPA dosyalarını kontrol et ve listele ──
      - name: "📦 IPA dosyalarını kontrol et"
        run: |
          echo "══════════════════════════════════════"
          echo "  IPA Dosyaları"
          echo "══════════════════════════════════════"

          IPA_DIR="${GITHUB_WORKSPACE}/ipa"

          if [ -d "$IPA_DIR" ]; then
            IPA_COUNT=$(find "$IPA_DIR" -name "*.ipa" -type f | wc -l | tr -d ' ')
            echo "📂 IPA klasörü: ${IPA_DIR}"
            echo "📦 Bulunan IPA sayısı: ${IPA_COUNT}"
            echo ""

            if [ "$IPA_COUNT" -gt 0 ]; then
              echo "Dosya listesi:"
              find "$IPA_DIR" -name "*.ipa" -type f -exec ls -lh {} \;
            else
              echo "⚠️  IPA klasöründe dosya bulunamadı"
              echo "   IPA dosyalarınızı repo'daki ipa/ klasörüne ekleyin"
            fi
          else
            echo "⚠️  ipa/ klasörü bulunamadı"
          fi

          echo ""
          echo "══════════════════════════════════════"

      # ── 5. tmate SSH oturumu başlat ──
      - name: "🔐 tmate SSH oturumu başlat"
        uses: mxschmitt/action-tmate@v3
        with:
          # Sadece workflow'u tetikleyen kişi erişebilir
          limit-access-to-actor: true
          # Detached mod: true ise arka planda çalışır
          detached: ${{ github.event.inputs.detached }}
        timeout-minutes: ${{ fromJSON(github.event.inputs.timeout) }}
