# ============================================================================
# Yöntem 3: VNC ile Grafik Masaüstü Erişimi
# Tam macOS masaüstü deneyimi — ngrok hesabı gerektirir
# ============================================================================
# Gerekli Secrets:
#   - NGROK_AUTH_TOKEN : ngrok dashboard'dan alınır
#   - VNC_PASSWORD     : VNC bağlantı şifresi (maks. 8 karakter)
#
# Kullanım: Actions → "macOS VNC Masaüstü" → Run workflow
# Bağlantı: Workflow loglarındaki VNC adresini VNC istemcinize girin

name: "macOS VNC Masaüstü"

on:
  workflow_dispatch:
    inputs:
      macos-version:
        description: "macOS sürümü"
        required: true
        type: choice
        options:
          - "macos-latest"
          - "macos-15"
          - "macos-14"
          - "macos-13"
        default: "macos-latest"
      timeout:
        description: "Maksimum oturum süresi (dakika)"
        required: true
        type: choice
        options:
          - "30"
          - "60"
          - "120"
          - "180"
          - "360"
        default: "120"
      install-transporter:
        description: "Transporter uygulamasını kur"
        required: true
        type: boolean
        default: true
      copy-ipa-to-desktop:
        description: "IPA dosyalarını masaüstüne kopyala"
        required: true
        type: boolean
        default: true

jobs:
  macos-vnc-desktop:
    name: "macOS VNC Masaüstü Oturumu"
    runs-on: ${{ github.event.inputs.macos-version }}
    timeout-minutes: ${{ fromJSON(github.event.inputs.timeout) }}

    steps:
      # ── 1. Repo'yu clone et ──
      - name: "📥 Repo'yu checkout et"
        uses: actions/checkout@v4

      # ── 2. Ortam hazırlığı ──
      - name: "🔧 Ortam hazırlığı"
        run: |
          chmod +x scripts/setup-environment.sh
          bash scripts/setup-environment.sh

      # ── 3. Transporter kurulumu ──
      - name: "📱 Transporter kurulumu"
        if: ${{ github.event.inputs.install-transporter == 'true' }}
        run: |
          chmod +x scripts/install-transporter.sh
          bash scripts/install-transporter.sh

      # ── 4. IPA dosyalarını masaüstüne kopyala ──
      - name: "📦 IPA dosyalarını hazırla"
        if: ${{ github.event.inputs.copy-ipa-to-desktop == 'true' }}
        run: |
          IPA_DIR="${GITHUB_WORKSPACE}/ipa"
          DESKTOP_DIR="$HOME/Desktop/IPA_Dosyalari"

          echo "══════════════════════════════════════"
          echo "  IPA Dosya Transferi"
          echo "══════════════════════════════════════"

          if [ -d "$IPA_DIR" ]; then
            IPA_COUNT=$(find "$IPA_DIR" -name "*.ipa" -type f | wc -l | tr -d ' ')

            if [ "$IPA_COUNT" -gt 0 ]; then
              # Masaüstünde klasör oluştur
              mkdir -p "$DESKTOP_DIR"

              # IPA dosyalarını kopyala
              find "$IPA_DIR" -name "*.ipa" -type f -exec cp {} "$DESKTOP_DIR/" \;

              echo "✅ ${IPA_COUNT} IPA dosyası masaüstüne kopyalandı:"
              echo "   📂 ${DESKTOP_DIR}"
              ls -lh "$DESKTOP_DIR/"
            else
              echo "⚠️  IPA klasöründe dosya bulunamadı"
            fi
          else
            echo "⚠️  ipa/ klasörü bulunamadı"
          fi

          echo ""
          echo "📂 Repo dizini: ${GITHUB_WORKSPACE}/ipa"
          echo "══════════════════════════════════════"

      # ── 5. VNC yapılandırması ve ngrok tüneli ──
      - name: "🖥️ VNC masaüstü erişimi başlat"
        env:
          VNC_PASSWORD: ${{ secrets.VNC_PASSWORD }}
          NGROK_AUTH_TOKEN: ${{ secrets.NGROK_AUTH_TOKEN }}
        run: |
          # Secret kontrolü
          if [ -z "$VNC_PASSWORD" ]; then
            echo "❌ VNC_PASSWORD secret'ı ayarlanmamış!"
            echo "   Settings → Secrets → Actions → New repository secret"
            echo "   Not: VNC şifresi maksimum 8 karakter olmalıdır"
            exit 1
          fi

          if [ -z "$NGROK_AUTH_TOKEN" ]; then
            echo "❌ NGROK_AUTH_TOKEN secret'ı ayarlanmamış!"
            exit 1
          fi

          chmod +x scripts/setup-vnc.sh
          bash scripts/setup-vnc.sh
