# ============================================================================
# Yöntem 4: Tailscale ile Güvenli Özel Ağ Erişimi
# WireGuard tabanlı en güvenli yöntem — Tailscale hesabı gerektirir
# ============================================================================
# Gerekli Secrets:
#   - TAILSCALE_AUTH_KEY : Tailscale Admin Console'dan alınır (ephemeral önerilir)
#
# Kullanım: Actions → "macOS Tailscale" → Run workflow
# Bağlantı: Runner'ın tailnet IP'si loglardan alınır, SSH/VNC ile bağlanılır
# Not: Kendi cihazınızda da Tailscale kurulu ve aynı tailnet'e bağlı olmalı

name: "macOS Tailscale"

on:
  workflow_dispatch:
    inputs:
      macos-version:
        description: "macOS sürümü"
        required: true
        type: choice
        options:
          - "macos-latest"
          - "macos-15"
          - "macos-14"
          - "macos-13"
        default: "macos-latest"
      timeout:
        description: "Maksimum oturum süresi (dakika)"
        required: true
        type: choice
        options:
          - "30"
          - "60"
          - "120"
          - "180"
          - "360"
        default: "120"
      install-transporter:
        description: "Transporter uygulamasını kur"
        required: true
        type: boolean
        default: true
      enable-ssh:
        description: "SSH erişimini etkinleştir"
        required: true
        type: boolean
        default: true
      enable-vnc:
        description: "VNC masaüstü erişimini etkinleştir"
        required: true
        type: boolean
        default: false
      vnc-password:
        description: "VNC şifresi (VNC aktifse gerekli, maks 8 kar.)"
        required: false
        type: string
        default: ""

jobs:
  macos-tailscale:
    name: "macOS Tailscale Oturumu"
    runs-on: ${{ github.event.inputs.macos-version }}
    timeout-minutes: ${{ fromJSON(github.event.inputs.timeout) }}

    steps:
      # ── 1. Repo'yu clone et ──
      - name: "📥 Repo'yu checkout et"
        uses: actions/checkout@v4

      # ── 2. Ortam hazırlığı ──
      - name: "🔧 Ortam hazırlığı"
        run: |
          chmod +x scripts/setup-environment.sh
          bash scripts/setup-environment.sh

      # ── 3. Transporter kurulumu ──
      - name: "📱 Transporter kurulumu"
        if: ${{ github.event.inputs.install-transporter == 'true' }}
        run: |
          chmod +x scripts/install-transporter.sh
          bash scripts/install-transporter.sh

      # ── 4. IPA dosyalarını kontrol et ──
      - name: "📦 IPA dosyalarını kontrol et"
        run: |
          IPA_DIR="${GITHUB_WORKSPACE}/ipa"
          echo "══════════════════════════════════════"
          echo "  IPA Dosyaları"
          echo "══════════════════════════════════════"

          if [ -d "$IPA_DIR" ]; then
            IPA_COUNT=$(find "$IPA_DIR" -name "*.ipa" -type f | wc -l | tr -d ' ')
            echo "📂 IPA klasörü: ${IPA_DIR}"
            echo "📦 Bulunan IPA sayısı: ${IPA_COUNT}"
            if [ "$IPA_COUNT" -gt 0 ]; then
              find "$IPA_DIR" -name "*.ipa" -type f -exec ls -lh {} \;

              # VNC modunda masaüstüne de kopyala
              if [[ "${{ github.event.inputs.enable-vnc }}" == "true" ]]; then
                DESKTOP_DIR="$HOME/Desktop/IPA_Dosyalari"
                mkdir -p "$DESKTOP_DIR"
                find "$IPA_DIR" -name "*.ipa" -type f -exec cp {} "$DESKTOP_DIR/" \;
                echo "📋 IPA'lar masaüstüne de kopyalandı: ${DESKTOP_DIR}"
              fi
            fi
          else
            echo "⚠️  ipa/ klasörü bulunamadı"
          fi
          echo "══════════════════════════════════════"

      # ── 5. Tailscale kurulumu ve bağlantısı ──
      - name: "🔗 Tailscale ağına bağlan"
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          if [ -z "$TAILSCALE_AUTH_KEY" ]; then
            echo "❌ TAILSCALE_AUTH_KEY secret'ı ayarlanmamış!"
            echo ""
            echo "Tailscale Auth Key oluşturmak için:"
            echo "  1. https://login.tailscale.com/admin/settings/keys adresine gidin"
            echo "  2. 'Generate auth key' tıklayın"
            echo "  3. 'Ephemeral' seçeneğini işaretleyin"
            echo "  4. Oluşturulan anahtarı GitHub Secrets'a TAILSCALE_AUTH_KEY olarak ekleyin"
            exit 1
          fi

          echo "Tailscale kuruluyor..."

          # Tailscale kurulumu
          brew install tailscale 2>/dev/null || {
            echo "Homebrew ile kurulamadı, cask deneniyor..."
            brew install --cask tailscale 2>/dev/null || {
              echo "❌ Tailscale kurulamadı!"
              exit 1
            }
          }

          echo "✅ Tailscale kuruldu"

          # Tailscale'i başlat
          sudo tailscaled --state=/tmp/tailscale-state &
          sleep 3

          # Ağa katıl
          sudo tailscale up --authkey="$TAILSCALE_AUTH_KEY" --hostname="github-macos-runner"
          sleep 2

          echo "✅ Tailscale ağına bağlanıldı"

      # ── 6. SSH sunucusu ──
      - name: "🔐 SSH sunucusu etkinleştir"
        if: ${{ github.event.inputs.enable-ssh == 'true' }}
        run: |
          sudo systemsetup -setremotelogin on 2>/dev/null || \
          sudo launchctl load -w /System/Library/LaunchDaemons/ssh.plist 2>/dev/null || true

          echo "✅ SSH sunucusu etkinleştirildi"

      # ── 7. VNC / Screen Sharing ──
      - name: "🖥️ VNC etkinleştir"
        if: ${{ github.event.inputs.enable-vnc == 'true' }}
        run: |
          VNC_PASS="${{ github.event.inputs.vnc-password }}"
          CURRENT_USER=$(whoami)

          if [ -z "$VNC_PASS" ]; then
            echo "⚠️  VNC şifresi belirtilmedi, varsayılan kullanılıyor"
            VNC_PASS="runner"
          fi

          # Şifre maks 8 karakter
          VNC_PASS="${VNC_PASS:0:8}"

          # Kullanıcı şifresi ayarla
          echo "$VNC_PASS" | sudo dscl . -passwd /Users/"${CURRENT_USER}" 2>/dev/null || \
          sudo sysadminctl -resetPasswordFor "${CURRENT_USER}" -newPassword "$VNC_PASS" 2>/dev/null || true

          # Screen Sharing etkinleştir
          KICKSTART="/System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart"
          if [ -f "$KICKSTART" ]; then
            sudo "$KICKSTART" -activate -configure \
              -allowAccessFor -allUsers \
              -privs -all \
              -clientopts -setmenuextra -menuextra yes \
              2>/dev/null || true
          else
            sudo launchctl load -w /System/Library/LaunchDaemons/com.apple.screensharing.plist 2>/dev/null || true
          fi

          echo "✅ VNC etkinleştirildi"
          echo "   Şifre: (giriş parametresinde belirtildi)"

      # ── 8. Bağlantı bilgilerini göster ve oturumu canlı tut ──
      - name: "🌐 Bağlantı bilgileri ve oturum"
        run: |
          CURRENT_USER=$(whoami)
          TAILSCALE_IP=$(tailscale ip -4 2>/dev/null || echo "Alınamadı")
          TAILSCALE_HOSTNAME=$(tailscale status --json 2>/dev/null | python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          self_key = data.get('Self', {}).get('DNSName', 'Bilinmiyor')
          print(self_key.rstrip('.'))
          " 2>/dev/null || echo "github-macos-runner")

          echo ""
          echo "══════════════════════════════════════════════════════"
          echo "  🔗 TAILSCALE BAĞLANTI BİLGİLERİ"
          echo "══════════════════════════════════════════════════════"
          echo ""
          echo "  🌐 Tailscale IP   : ${TAILSCALE_IP}"
          echo "  🏷️  Hostname      : ${TAILSCALE_HOSTNAME}"
          echo "  👤 Kullanıcı      : ${CURRENT_USER}"
          echo ""

          if [[ "${{ github.event.inputs.enable-ssh }}" == "true" ]]; then
            echo "  📋 SSH Bağlantısı:"
            echo "     ssh ${CURRENT_USER}@${TAILSCALE_IP}"
            echo "     veya"
            echo "     ssh ${CURRENT_USER}@${TAILSCALE_HOSTNAME}"
            echo ""
          fi

          if [[ "${{ github.event.inputs.enable-vnc }}" == "true" ]]; then
            echo "  🖥️  VNC Bağlantısı:"
            echo "     vnc://${TAILSCALE_IP}:5900"
            echo "     veya"
            echo "     vnc://${TAILSCALE_HOSTNAME}:5900"
            echo ""
          fi

          echo "  📂 IPA Dosyaları  : ${GITHUB_WORKSPACE}/ipa/"
          echo "  ⏰ Timeout       : ${{ github.event.inputs.timeout }} dakika"
          echo ""
          echo "  ℹ️  Not: Kendi cihazınızda da Tailscale kurulu ve"
          echo "       aynı tailnet'e bağlı olmalıdır!"
          echo ""
          echo "══════════════════════════════════════════════════════"
          echo ""
          echo "⏳ Oturum aktif — timeout'a kadar açık kalacak..."

          # Tailscale durumunu göster
          tailscale status 2>/dev/null || true

          echo ""

          # Oturumu canlı tut
          while true; do
            sleep 60
            echo "♻️  $(date '+%H:%M:%S') — Oturum aktif"
          done
